name: Deploy Backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "agents.py"
      - "tools.py"
      - "pipeline.py"
      - "requirements.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/deploy-backend-render.yml"
  workflow_dispatch:

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deploy hook..."
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered. Check Render dashboard for build logs."

      - name: No deploy hook — using Render auto-deploy
        if: secrets.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::RENDER_DEPLOY_HOOK_URL not set — skipping hook."
          echo "Render will auto-deploy via GitHub integration + render.yaml if connected."
          echo "To enable hook: Render Dashboard > Service > Settings > Deploy Hook > copy URL > GitHub Repo Settings > Secrets > RENDER_DEPLOY_HOOK_URL"

  # Optional: build Docker image to verify Dockerfile on every push (GHCR)
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: researchforge-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
