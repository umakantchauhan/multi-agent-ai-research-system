name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn httpx pytest

      - name: Lint (py_compile)
        run: |
          python -m py_compile agents.py tools.py pipeline.py backend/api.py
          echo "Python syntax OK"

      - name: Smoke import test (no API keys needed)
        env:
          # dummy keys so imports don't fail; pipeline not executed
          TAVILY_API_KEY: dummy
          GEMINI_API_KEY: dummy
          GOOGLE_API_KEY: dummy
        run: |
          python -c "import agents, tools, pipeline; print('agents/tools/pipeline import OK')"
          python -c "from backend.api import app; print('FastAPI app import OK')"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        env:
          # Build should succeed without real backend; route.ts falls back to mock
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

  # Optional: fail fast if any job fails
  ci-success:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed — backend + frontend builds OK"
